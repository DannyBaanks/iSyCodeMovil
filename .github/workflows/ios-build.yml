name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versioned release to publish from main, e.g. v0.5.0 (empty = CI pre-release)"
        required: false
        default: ""

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SCHEME: IysCodeMovil

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.xcresult' ; then
            echo "::error::Unresolved source-control conflict markers found."
            exit 1
          fi
          if git grep -n $'\xEF\xBB\xBF' -- '*.swift' ; then
            echo "::warning::UTF-8 BOM detected in Swift sources."
          fi

      - name: Verify pinned GUS model manifest
        run: python3 scripts/verify-gus-model-manifest.py
      
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned llama.cpp iOS XCFramework
        run: bash scripts/build-llama-xcframework.sh
      
      - name: Generate Xcode project
        run: xcodegen generate
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: List schemes
        run: xcodebuild -list
      
      - name: Build unsigned (verbose)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/iyscodemovil_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.log
          retention-days: 14
      
      - name: Verify .app structure
        run: |
          APP_PATH=$(find /tmp/iyscodemovil_dd -name "IysCodeMovil.app" -type d | head -1)
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH/"
          echo "---"
          file "$APP_PATH/IysCodeMovil" || echo "Executable not found"
      
      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find /tmp/iyscodemovil_dd -name "IysCodeMovil.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
      
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r IysCodeMovil-unsigned.ipa Payload

      - name: Verify model weights are not bundled
        run: |
          set -euo pipefail
          if unzip -l IysCodeMovil-unsigned.ipa | grep -i '\.gguf'; then
            echo "::error::The Qwen GGUF must stay out of the IPA."
            exit 1
          fi
          echo "Unsigned IPA size: $(du -h IysCodeMovil-unsigned.ipa | cut -f1)"
          echo "llama.cpp source: $(cat .build/llama/SOURCE_COMMIT)"
      
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IysCodeMovil-unsigned
          path: IysCodeMovil-unsigned.ipa
          retention-days: 30

  test:
    name: Run unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.xcresult' ; then
            echo "::error::Unresolved source-control conflict markers found."
            exit 1
          fi
          if git grep -n $'\xEF\xBB\xBF' -- '*.swift' ; then
            echo "::warning::UTF-8 BOM detected in Swift sources."
          fi

      - name: Verify pinned GUS model manifest
        run: python3 scripts/verify-gus-model-manifest.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install CMake
        run: brew install cmake

      - name: Build pinned llama.cpp iOS XCFramework
        run: bash scripts/build-llama-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Simulator destinations
        run: xcrun simctl list devices available | head -40

      - name: Run tests
        run: |
          set -o pipefail
          # Resolve a concrete iPhone on the latest iOS runtime installed on the runner.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          ios_phones = []
          for runtime, devices in d.get('devices', {}).items():
            if 'iOS' not in runtime:
              continue
            for dev in devices:
              if dev.get('isAvailable') and 'iPhone' in dev.get('name',''):
                ios_phones.append(dev['udid'])
          print(ios_phones[0] if ios_phones else '')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on the runner."
            xcrun simctl list devices available | head -40
            exit 1
          fi
          echo "Resolved simulator UDID: $UDID"
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

          # Clean derived data before testing to avoid "Multiple commands produce" errors
          rm -rf /tmp/iyscodemovil_dd_test

          xcodebuild test \
            -scheme IysCodeMovil \
            -destination "id=$UDID" \
            -derivedDataPath /tmp/iyscodemovil_dd_test \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test-output.log

      - name: Fail if tests did not run
        run: |
          cat test-output.log | tr -d '\r' | sed $'s/\x1b\[[0-9;]*m//g' > test-output-clean.log
          grep -E "(Executed [0-9]+ test|TEST (FAILED|PASSED))" test-output-clean.log || (echo "::error::No tests executed" && exit 1)

      - name: Capture README screenshots from iOS Simulator
        run: |
          set -euo pipefail
          UDID="$IOS_SIMULATOR_UDID"
          APP_PATH="/tmp/iyscodemovil_dd_test/Build/Products/Debug-iphonesimulator/IysCodeMovil.app"
          test -d "$APP_PATH"
          mkdir -p docs/screenshots
          DEVICE_STATE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x.get('state','') for group in d.get('devices',{}).values() for x in group if x.get('udid')=='$UDID'),''))")
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
          fi
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl terminate "$UDID" dev.iyscode.movil || true
          xcrun simctl launch "$UDID" dev.iyscode.movil
          sleep 4
          xcrun simctl io "$UDID" screenshot docs/screenshots/connect.png
          sips -Z 1600 docs/screenshots/connect.png
          for SCENE in projects chat; do
            xcrun simctl terminate "$UDID" dev.iyscode.movil || true
            xcrun simctl launch "$UDID" dev.iyscode.movil "--readme-screenshot=$SCENE"
            sleep 3
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$SCENE.png"
            sips -Z 1600 "docs/screenshots/$SCENE.png"
          done
          # The Asistente in both appearances: home in light mode, the memory graph in dark.
          for SHOT in "assistant:light" "assistant-memory:dark"; do
            SCENE="${SHOT%%:*}"
            xcrun simctl ui "$UDID" appearance "${SHOT##*:}"
            xcrun simctl terminate "$UDID" dev.iyscode.movil || true
            xcrun simctl launch "$UDID" dev.iyscode.movil "--readme-screenshot=$SCENE"
            sleep 4
            xcrun simctl io "$UDID" screenshot "docs/screenshots/$SCENE.png"
            sips -Z 1600 "docs/screenshots/$SCENE.png"
          done
          xcrun simctl ui "$UDID" appearance dark

      - name: Upload README screenshots
        uses: actions/upload-artifact@v4
        with:
          name: IysCodeMovil-ci-screenshots
          path: docs/screenshots/*.png
          retention-days: 30

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

  capability-report:
    name: Generate capability report
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate capability matrix
        run: |
          cat << 'EOF' | sed 's/^          //' > CAPABILITY_MATRIX.md
          # Capability Matrix — IysCodeMovil iOS

          > Generada por CI. Para evidencia completa ver `docs/OPENCODE_COMPAT.md`.

          ## OpenCode TUI Compatibility (anomalyco/opencode@dev, MIT)

          | Req OpenCode | Estado iOS | Evidencia |
          |---|---|---|
          | Binario iOS OpenCode | ❌ IMPOSIBLE | `install` script: solo linux/darwin/win × {x64,arm64}; `ios-*` → reject |
          | Runtime Bun 1.3.x | ❌ IMPOSIBLE | Bun no publica target `ios-arm64`; JSCore/WKWebView no cubren bun:/node:/PTY |
          | PTY/TTY (@lydell/node-pty, @opentui) | ❌ IMPOSIBLE | No hay openpty/posix_openpt ni TTY raw en iOS SDK |
          | spawn/exec (cross-spawn) | ❌ IMPOSIBLE | Process/NSTask ausentes en iOS SDK; sandbox prohíbe fork/execve/posix_spawn |
          | node:fs + watch + glob | ⚠️ PARCIAL | Sources/Workspace + Sources/Tools reimplementan fs/glob en sandbox iOS |
          | @effect/sql-sqlite-bun | ⚠️ PARCIAL | SQLite del sistema via Swift; no la variante Bun |
          | tree-sitter native | ❌ IMPOSIBLE | tree-sitter-* requiere compilar para arm64-ios (sin toolchain en device) |
          | TLS + WS + mDNS | ✅ POSIBLE | URLSession + URLSessionWebSocketTask + NWListener/NWBrowser |
          | Entorno POSIX (SHELL/HOME/EDITOR) | ❌ IMPOSIBLE | No hay shell ni $HOME POSIX en iOS |

          ## Veredicto

          **BLOCKED** — el TUI real de OpenCode no arranca en iOS. Primer hard blocker:
          PTY/TTY (el renderer @opentui no puede inicializar). No se simula.

          ### Runtime nativo alternativo (no OpenCode) que SÍ corre en iOS

          | Capability | iOS | Implementación |
          |---|---|---|
          | FS sandbox (read/write/list/move/delete/create) | ✅ | `Sources/Workspace/Workspace.swift` |
          | Glob search | ✅ | `Sources/Tools/GlobMatcher.swift` (puro Swift) |
          | 8 tools de filesystem | ✅ | `Sources/Tools/FileSystemTools.swift` |
          | Agent loop async multi-turn | ✅ | `Sources/Agent/AgentLoop.swift` |
          | LLM API remoto (OpenAI-compat) | ✅ | `Sources/Model/ModelProvider.swift` |
          | Provider scripteado offline (demo/tests) | ✅ | `Sources/Model/ScriptedModelProvider.swift` |
          | Persistencia JSON + JSONL audit | ✅ | `Sources/Persistence/Persistence.swift` |
          | TUI/console-first UI (no chat) | ✅ | `Sources/UI/ConsoleView.swift` |
          | Capability matrix en runtime | ✅ | `Sources/Host/IOSCapabilityMatrix.swift` |

          ## Restricciones iOS (no fingidas)
          - Ejecutar código arbitrario (shell, python, git, compiladores): IMPOSIBLE
          - Operaciones fuera del sandbox: IMPOSIBLE
          - Terminal real / PTY: IMPOSIBLE
          - Code signing en Windows: requiere macOS (GitHub Actions macOS runner + iloader)

          ## Atribución

          OpenCode © anomalyco, MIT. IysCodeMovil NO es OpenCode y no está afiliado.
          EOF
      
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: capability-report
          path: CAPABILITY_MATRIX.md

  sign:
    name: Sign IPA with iloader (optional)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Solo corre si el repo tiene el var ENABLE_ILOADER_SIGN='true' y los secrets APPLE_ID/TEAM_ID configurados.
    if: ${{ vars.ENABLE_ILOADER_SIGN == 'true' && github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: IysCodeMovil-unsigned
          path: ipa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install iloader
        run: |
          python -m pip install --upgrade pip
          pip install --user iloader

      - name: Sign IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          test -n "$APPLE_ID" || { echo "::error::Secret APPLE_ID missing"; exit 1; }
          test -n "$TEAM_ID"  || { echo "::error::Secret TEAM_ID missing"; exit 1; }
          python -m iloader sign \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            ipa/IysCodeMovil-unsigned.ipa \
            -o IysCodeMovil-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: IysCodeMovil-signed
          path: IysCodeMovil-signed.ipa
          retention-days: 30

  release:
    name: Publish GitHub pre-release
    runs-on: ubuntu-latest
    needs: [build, test, sign]
    # Publish one pre-release for each successful build of main. Manual builds
    # on feature branches remain CI-only and never create public releases.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.test.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: IysCodeMovil-unsigned
          path: release-assets

      - name: Download signed IPA when available
        if: ${{ needs.sign.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: IysCodeMovil-signed
          path: release-assets

      - name: Prepare checksums and release notes
        id: release_metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum ./*.ipa > SHA256SUMS.txt)
          if [[ -n "${RELEASE_TAG}" ]]; then
            # Versioned release: tag, notes and app version must agree.
            [[ "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::release_tag must look like v0.5.0"; exit 1; }
            VERSION="${RELEASE_TAG#v}"
            NOTES="docs/releases/${RELEASE_TAG}.md"
            [[ -f "$NOTES" ]] || { echo "::error::Missing $NOTES"; exit 1; }
            grep -q "MARKETING_VERSION: \"${VERSION}\"" project.yml || { echo "::error::project.yml MARKETING_VERSION is not ${VERSION}"; exit 1; }
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then echo "::error::${RELEASE_TAG} already exists"; exit 1; fi
            cp "$NOTES" release-assets/RELEASE-NOTES.md
            printf '\n---\n\n- Commit: %s\n- CI: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-assets/RELEASE-NOTES.md
            {
              echo "tag=${RELEASE_TAG}"
              echo "title=iSyCode Móvil ${VERSION%.0}"
              echo "notes=release-assets/RELEASE-NOTES.md"
              echo "flags=--latest"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [[ -f release-assets/IysCodeMovil-signed.ipa ]]; then
            INSTALL_NOTE="A signed IPA is attached when the repository signing job completed successfully."
          else
            INSTALL_NOTE="Only the unsigned IPA is attached; it must be signed through an authorized Apple distribution path before installation."
          fi
          cat > release-assets/RELEASE-NOTES.txt <<EOF
          Automated ISyCode Móvil pre-release from commit ${GITHUB_SHA}.

          - CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - ${INSTALL_NOTE}
          - GUS model files are not included in the IPA. The app downloads pinned models separately and verifies their SHA-256.
          - Model provenance and license: docs/MODEL_NOTICE.md in the source repository.

          These builds are pre-releases for testing and are not stable version-numbered releases.
          EOF
          {
            echo "tag=$TAG"
            echo "title=ISyCode Móvil CI $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})"
            echo "notes=release-assets/RELEASE-NOTES.txt"
            echo "flags=--prerelease --latest=false"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release with IPA and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # flags are intentionally word-split
          gh release create "${{ steps.release_metadata.outputs.tag }}" \
            release-assets/*.ipa \
            release-assets/SHA256SUMS.txt \
            "${{ steps.release_metadata.outputs.notes }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release_metadata.outputs.title }}" \
            --notes-file "${{ steps.release_metadata.outputs.notes }}" \
            ${{ steps.release_metadata.outputs.flags }}
